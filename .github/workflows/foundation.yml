name: Presentation foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/render/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Verify generated schema and types
        run: |
          presentation-schema
          npm --prefix workers/render ci --ignore-scripts --no-audit --no-fund
          npm --prefix workers/render run build
          git diff --exit-code -- contracts workers/render/src/deck.generated.d.ts
      - name: Lint, type-check and test real PPTX exports
        run: |
          ruff check app tests examples
          ruff format --check app tests examples
          mypy app
          pytest
