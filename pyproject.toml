[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "owner-voice-presentations"
version = "0.1.0"
description = "Reviewed-source presentation foundation for an authorized voice assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.0",
  "uvicorn==0.38.0",
  "httpx==0.28.1",
  "pydantic==2.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.3",
  "mypy==1.18.2",
]

[project.scripts]
presentation-api = "app.main:run"
presentation-schema = "app.schema:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
